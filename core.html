<title>好きの種</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@300;400;500&display=swap">
<style>
/* ── 単一テーマの意図的な確定：夜の散歩の画面。黒地・白・白の透明度のみ ── */
:root{
  color-scheme: dark;
  --void:#08080A;
  --void2:#0E0E12;
  --lume:#FAFAF7;
  --l86:rgba(250,250,247,.86);
  --l58:rgba(250,250,247,.58);
  --l40:rgba(250,250,247,.40);
  --l26:rgba(250,250,247,.26);
  --l16:rgba(250,250,247,.16);
  --l09:rgba(250,250,247,.09);
  --l05:rgba(250,250,247,.05);
  --f:"M PLUS 2",-apple-system,'Hiragino Sans','Helvetica Neue',sans-serif;
  --ease:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--void);color:var(--lume);font-family:var(--f);overscroll-behavior:none}
body{font-size:15px;font-weight:400;line-height:1.7;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--l58);outline-offset:3px}

/* ── 3面トラック：左=記録 中央=投げる 右=箱 ── */
.track{display:flex;height:100dvh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track.lock{overflow-x:hidden}
.pane{position:relative;flex:0 0 100%;height:100dvh;scroll-snap-align:center;scroll-snap-stop:always;overflow:hidden}

/* ── 面の位置を示す3点（文字を置かないための唯一の道標） ── */
.dots{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:7px;justify-content:center;z-index:40;pointer-events:none;transition:opacity .3s}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--l16);transition:background .3s,width .3s var(--ease)}
.dots i.on{background:var(--l58);width:14px;border-radius:2px}

/* ── 投げる ──
   丸を押すと、そのまま書ける状態になる。声はキーボードのマイク（Appleの文字起こし）で入れる。
   Web Speech API は使わない：起動のたびに許可を訊かれ、開始音も鳴り、どちらもAPIから止められない。 */
#throw{display:grid;place-items:center;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + var(--kb,0px));
  transition:padding-bottom .22s var(--ease)}
.stage{display:flex;flex-direction:column;align-items:center;width:100%;padding:0 26px}

.said{width:100%;max-width:19em;text-align:center;text-wrap:balance;
  font-weight:300;font-size:clamp(20px,5.6vw,27px);line-height:1.55;letter-spacing:-.005em;
  word-break:auto-phrase;max-height:0;opacity:0;margin-bottom:0;overflow:hidden;
  transition:max-height .34s var(--ease),opacity .24s,margin-bottom .34s var(--ease)}
.said:focus{outline:none}
.said:empty::before{content:"speak";color:var(--l16);letter-spacing:.34em}
#throw[data-state="confirm"] .said{max-height:42vh;opacity:1;margin-bottom:32px;overflow-y:auto;
  border-bottom:1px solid var(--l09);padding-bottom:12px}
body.kb #throw[data-state="confirm"] .said{max-height:32vh;margin-bottom:24px}

.orbwrap{position:relative;display:grid;place-items:center;flex:0 0 auto;
  width:min(62vw,250px);aspect-ratio:1;
  transition:width .38s var(--ease),opacity .28s}
#throw[data-state="confirm"] .orbwrap{width:min(28vw,108px)}
/* キーボードが出ているあいだは丸を畳んで、場所を譲る */
body.kb #throw .orbwrap{width:0;opacity:0}
.orb{position:relative;z-index:2;width:100%;height:100%;border-radius:50%;border:0;
  background:var(--lume);touch-action:manipulation;
  animation:breathe 5.4s ease-in-out infinite;
  transition:transform .18s var(--ease),background .3s}
.orb.press{transform:scale(.94)}
#throw[data-state="confirm"] .orb{animation:none}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.028)}}

.acts{display:flex;align-items:center;gap:26px;max-height:0;opacity:0;margin-top:0;overflow:hidden;
  transition:max-height .3s var(--ease),opacity .24s,margin-top .3s var(--ease)}
#throw[data-state="confirm"] .acts{max-height:80px;opacity:1;margin-top:32px}
body.kb #throw[data-state="confirm"] .acts{margin-top:22px}
.place{min-height:52px;padding:0 42px;border-radius:26px;border:1px solid var(--l26);background:var(--l05);
  font-size:13px;font-weight:500;letter-spacing:.3em;text-indent:.3em;transition:background .2s,border-color .2s}
.place:active{background:var(--l09);border-color:var(--l40)}
.drop{color:var(--l40);font-size:12px;letter-spacing:.24em;text-indent:.24em}
.drop:active{color:var(--l86)}
.tip{position:absolute;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));
  text-align:center;font-size:10.5px;letter-spacing:.34em;text-indent:.34em;color:var(--l26);
  opacity:0;pointer-events:none;transition:opacity .3s}
#throw[data-state="confirm"] .tip{opacity:1}
/* 英字ラベルの共通の置き方 */
.tip,.hint,.ghost span,.empty,.place,.route button,.drop,.cfoot,.h,.today span,
.stats span,.dfoot,.recent .r em,.toast,.toast button,.said:empty::before,
.memo h2,.mAdd,.hhead span,.hempty,.htip{text-transform:lowercase}
/* キーボードに隠れるものは、出ているあいだ引っ込める */
body.kb #throw .tip,body.kb .dots{opacity:0}

/* ── めくる層：思いつかない日に、人が実際やっていたことを繰る ── */
.muse{position:absolute;inset:0;z-index:20;display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top) + 40px) 30px calc(env(safe-area-inset-bottom) + 76px);
  background:var(--void);opacity:0;pointer-events:none;transition:opacity .3s}
.muse.on{opacity:1;pointer-events:auto;touch-action:none}
.mcard{max-width:20em;text-align:center}
.mwho{font-size:10.5px;letter-spacing:.2em;color:var(--l40);margin-bottom:24px}
.mwhat{font-weight:300;font-size:clamp(24px,7vw,32px);line-height:1.48;letter-spacing:-.015em;
  text-wrap:balance;word-break:auto-phrase;margin-bottom:22px}
.mnote{font-size:13.5px;line-height:1.92;color:var(--l40);text-wrap:pretty;word-break:auto-phrase}
.mcard.in{animation:drop .42s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
.mtip{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));
  text-align:center;font-size:10.5px;letter-spacing:.34em;text-indent:.34em;color:var(--l16)}

/* 引き下ろせる、という気配だけ置く。文字は使わない */
.pull{position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:50%;
  width:26px;height:2px;border-radius:1px;background:var(--l26);
  transform:translateX(-50%);opacity:0;transition:opacity .4s}
#throw[data-state="idle"] .pull{animation:nudge 4.8s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translate(-50%,0);opacity:.35}50%{transform:translate(-50%,5px);opacity:1}}
body.kb .pull{animation:none;opacity:0}

/* ── 種が箱へ飛ぶ ── */
.fly{position:fixed;z-index:60;pointer-events:none;font-family:var(--f);font-size:16px;color:var(--l86);
  white-space:nowrap;transition:transform .62s var(--ease),opacity .62s ease-in}

/* ── 箱 ── */
#box{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.jar{position:relative;flex:1 1 auto;min-height:0}
.bub{position:absolute;top:0;left:0;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--l16);background:rgba(250,250,247,var(--a,.04));
  font-family:var(--f);color:var(--l86);text-align:center;padding:0;overflow:hidden;
  will-change:transform;transition:border-color .3s,opacity .4s,filter .3s}
.bub b{font-weight:400;display:block;line-height:1.16;word-break:break-all;margin:0 auto}
.bub:active{--a:.17;border-color:var(--l40)}
.bub.fresh{animation:fade .55s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ghost{position:absolute;inset:0;display:grid;place-items:center;gap:0;pointer-events:none}
.ghost[hidden]{display:none}
.ghost span{font-size:11px;color:var(--l26);letter-spacing:.34em;text-indent:.34em}
.ghost svg{position:absolute;opacity:.5}

/* ── 天国：送り終えたものが昇っていく層。白と黒を入れ替える ── */
.heaven{position:absolute;inset:0;z-index:22;overflow:hidden;
  background:var(--lume);color:var(--void);
  opacity:0;pointer-events:none;transition:opacity .44s var(--ease)}
.heaven.on{opacity:1;pointer-events:auto;touch-action:none}
.hsky{position:absolute;inset:0}
/* 昇るほど光に溶ける。数字と泡が重なって読めなくなるのも、これで防ぐ */
.heaven::before,.heaven::after{content:"";position:absolute;left:0;right:0;z-index:1;pointer-events:none}
.heaven::before{top:0;height:36%;
  background:linear-gradient(to bottom,var(--lume) 26%,rgba(250,250,247,.72) 58%,rgba(250,250,247,0))}
.heaven::after{bottom:0;height:16%;
  background:linear-gradient(to top,var(--lume) 18%,rgba(250,250,247,0))}
.hb{position:absolute;top:0;left:0;display:grid;place-items:center;border-radius:50%;
  background:rgba(8,8,10,var(--a,.05));border:1px solid rgba(8,8,10,.11);
  color:rgba(8,8,10,.82);text-align:center;padding:0;overflow:hidden;will-change:transform}
.hb b{font-weight:400;display:block;line-height:1.16;word-break:break-all;margin:0 auto}
.hhead{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 38px);
  text-align:center;z-index:2;pointer-events:none}
.hhead b{display:block;font-weight:300;font-size:54px;line-height:1;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;color:rgba(8,8,10,.88)}
.hhead span{display:block;margin-top:12px;font-size:10.5px;letter-spacing:.34em;text-indent:.34em;
  color:rgba(8,8,10,.38)}
.hempty{position:absolute;inset:0;display:grid;place-items:center;
  font-size:11px;letter-spacing:.34em;text-indent:.34em;color:rgba(8,8,10,.26)}
.hempty[hidden]{display:none}
.htip{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));
  text-align:center;font-size:10.5px;letter-spacing:.34em;text-indent:.34em;
  color:rgba(8,8,10,.22);z-index:2}
body.sky .dots{opacity:0}

/* 昇っていける、という気配。箱の下端に置く。文字は使わない */
.rise{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 34px);left:50%;
  width:26px;height:2px;border-radius:1px;background:var(--l26);
  transform:translateX(-50%);opacity:0;animation:lift 4.8s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translate(-50%,0);opacity:.35}50%{transform:translate(-50%,-5px);opacity:1}}

/* 送った瞬間に弾けて、上へ抜けていく */
.burst{position:absolute;width:0;height:0;z-index:30;pointer-events:none}
.burst i{position:absolute;left:0;top:0;border-radius:50%;background:var(--lume);opacity:0;
  animation:pop .86s cubic-bezier(.14,.7,.3,1) forwards}
@keyframes pop{
  0%{opacity:0;transform:translate(0,0) scale(.35)}
  10%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}
}
.soul{position:absolute;z-index:31;pointer-events:none;font-size:16px;color:var(--l86);
  white-space:nowrap;animation:ascend 1.2s cubic-bezier(.3,.5,.2,1) forwards}
@keyframes ascend{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-460%) scale(.7)}
}

/* 種のカード */
.card{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding:0 22px calc(46px + env(safe-area-inset-bottom));background:rgba(8,8,10,.78);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .26s}
.card.on{opacity:1;pointer-events:auto}
.disc{position:relative;width:min(76vw,320px);aspect-ratio:1;border-radius:50%;border:1px solid var(--l16);
  background:var(--l05);display:grid;place-items:center;padding:13%;
  transform:scale(.8);opacity:0;touch-action:none;
  transition:transform .36s var(--ease),opacity .3s}
.card.on .disc{transform:scale(var(--s,1));opacity:1}
/* 回している最中だけ、追随を速くする */
.disc.turning,.disc.turning .discIn,.disc.turning .mark{transition:transform .09s linear}
/* 円が大きくなっても文字の大きさは変えない（逆にかけ戻す） */
.discIn{transform:scale(calc(1 / var(--s,1)));transition:transform .36s var(--ease)}
/* 縁の目印。どれだけ回したかが見える */
.mark{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  transform:rotate(var(--rot,0deg));transition:transform .09s linear}
.mark::before{content:"";position:absolute;top:-4px;left:50%;width:7px;height:7px;margin-left:-3.5px;
  border-radius:50%;background:var(--l58)}
/* 弾けている最中は、中身を引っ込めて見せ場を空ける */
.card.gone .disc,.card.gone .route,.card.gone .cfoot,.card.gone .hint{opacity:0;transition:opacity .2s}
.disc p{margin:0;font-family:var(--f);font-weight:300;font-size:clamp(17px,4.9vw,21px);line-height:1.62;letter-spacing:-.005em;text-align:center;text-wrap:balance;word-break:auto-phrase}
.disc .when{margin-top:14px;font-family:var(--f);font-size:10px;letter-spacing:.22em;color:var(--l26);font-variant-numeric:tabular-nums}
.route{display:flex;gap:12px;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .28s,transform .28s var(--ease)}
.route.on{opacity:1;transform:none;pointer-events:auto}
.route button{min-height:48px;padding:0 26px;font-size:13px;letter-spacing:.24em;text-indent:.24em;border-radius:24px}
.route .toH{border:1px solid var(--l40);background:var(--l05)}
.route .toP{border:1px dashed var(--l40)}
.cfoot{display:flex;gap:26px;color:var(--l26);font-size:11px;letter-spacing:.24em;text-indent:.24em}
.cfoot button:active{color:var(--l86)}
.hint{font-size:10.5px;letter-spacing:.34em;text-indent:.34em;color:var(--l26)}

/* ── 記録 ── */
#dash{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(34px + env(safe-area-inset-top)) 22px calc(56px + env(safe-area-inset-bottom) + var(--kb,0px))}
.h{font-size:11px;font-weight:500;letter-spacing:.34em;margin:0 0 30px;color:var(--l40)}
.today{display:flex;align-items:baseline;gap:11px;margin-bottom:32px}
.today b{font-family:var(--f);font-weight:300;font-size:66px;line-height:.88;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.today span{font-size:11px;letter-spacing:.3em;color:var(--l40)}
.chart{display:flex;align-items:flex-end;gap:4px;height:96px;border-bottom:1px solid var(--l09);padding-bottom:0}
.chart div{flex:1;min-width:0;background:var(--l16);border-radius:1px 1px 0 0;transition:height .5s var(--ease),background .3s}
.chart div.now{background:var(--l86)}
.chart div.zero{height:1px !important;background:var(--l09)}
.axis{display:flex;justify-content:space-between;margin-top:9px;font-size:10px;letter-spacing:.1em;color:var(--l26);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:34px 0 0;border-top:1px solid var(--l09)}
.stats div{padding:17px 0 0}
.stats b{display:block;font-family:var(--f);font-weight:300;font-size:32px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats span{display:block;margin-top:8px;font-size:10.5px;letter-spacing:.26em;color:var(--l40)}
.recent{margin-top:38px;border-top:1px solid var(--l09);padding-top:6px}
.recent .r{display:flex;align-items:baseline;gap:12px;padding:13px 0;border-bottom:1px solid var(--l05)}
.recent .r p{margin:0;flex:1;font-family:var(--f);font-size:14.5px;color:var(--l58);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .r em{font-style:normal;font-size:9.5px;letter-spacing:.2em;color:var(--l26);flex:0 0 auto}
.empty{font-size:11px;color:var(--l26);letter-spacing:.34em}
.dfoot{margin-top:40px;display:flex;gap:24px;font-size:10.5px;letter-spacing:.22em;color:var(--l26)}

/* 後日の改修のヒントを溜める枠 */
.memo{margin-top:46px;border-top:1px solid var(--l09);padding-top:24px}
.memo h2{font-size:11px;font-weight:500;letter-spacing:.34em;color:var(--l40);margin:0 0 18px}
.mIn{display:block;width:100%;min-height:76px;background:var(--l05);border:1px solid var(--l09);
  border-radius:12px;padding:13px 15px;color:var(--lume);font:inherit;font-size:14px;line-height:1.75;
  resize:none;-webkit-appearance:none;word-break:auto-phrase}
.mIn::placeholder{color:var(--l26);letter-spacing:.3em}
.mIn:focus{outline:none;border-color:var(--l26)}
.mAdd{margin-top:12px;min-height:42px;padding:0 26px;border-radius:21px;border:1px solid var(--l26);
  background:var(--l05);font-size:12px;font-weight:500;letter-spacing:.3em;text-indent:.3em}
.mAdd:active{background:var(--l09);border-color:var(--l40)}
.mList{margin-top:22px}
.mItem{display:flex;gap:14px;align-items:baseline;width:100%;text-align:left;
  padding:13px 0;border-bottom:1px solid var(--l05)}
.mItem p{margin:0;flex:1;font-size:13.5px;line-height:1.8;color:var(--l58);word-break:auto-phrase}
.mItem em{font-style:normal;flex:0 0 auto;font-size:9.5px;letter-spacing:.14em;color:var(--l26);
  font-variant-numeric:tabular-nums}
.mItem:active p{color:var(--l86)}
.dfoot button:active{color:var(--l86)}

/* ── 通知 ── */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:70;
  display:flex;align-items:center;gap:16px;max-width:88vw;padding:11px 18px;border-radius:23px;
  border:1px solid var(--l16);background:rgba(14,14,18,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-size:12px;letter-spacing:.2em;color:var(--l86);opacity:0;pointer-events:none;transition:opacity .24s,transform .24s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--l58);font-size:11.5px;letter-spacing:.22em;flex:0 0 auto}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.06s !important}
}
</style>

<main class="track" id="track">
  <section class="pane" id="dash" aria-label="記録">
    <div id="dashBody"></div>
    <div class="memo">
      <h2>notes</h2>
      <textarea class="mIn" id="mIn" rows="3" placeholder="note" aria-label="あとで直すためのメモ"></textarea>
      <button class="mAdd" id="mAdd">add</button>
      <div class="mList" id="mList"></div>
    </div>
  </section>

  <section class="pane" id="throw" aria-label="投げる" data-state="idle">
    <div class="stage">
      <div class="said" id="heard" contenteditable="true" role="textbox" aria-label="聞き取った内容"></div>
      <div class="orbwrap" id="orbwrap">
        <button class="orb" id="orb" aria-label="押して、声に出す"></button>
      </div>
      <div class="acts">
        <button class="place" id="place">keep</button>
        <button class="drop" id="drop">forget</button>
      </div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="pull"></div>
    <div class="muse" id="muse" aria-hidden="true">
      <div class="mcard" id="mcard">
        <div class="mwho" id="mWho"></div>
        <div class="mwhat" id="mWhat"></div>
        <div class="mnote" id="mNote"></div>
      </div>
      <div class="mtip">up</div>
    </div>
  </section>

  <section class="pane" id="box" aria-label="箱">
    <div class="jar" id="jar">
      <div class="ghost" id="ghost" hidden>
        <svg width="230" height="150" viewBox="0 0 230 150" aria-hidden="true">
          <circle cx="70" cy="62" r="34" fill="none" stroke="rgba(250,250,247,.16)"></circle>
          <circle cx="148" cy="48" r="22" fill="none" stroke="rgba(250,250,247,.13)"></circle>
          <circle cx="126" cy="106" r="27" fill="none" stroke="rgba(250,250,247,.10)"></circle>
        </svg>
        <span>soon</span>
      </div>
    </div>
    <div class="rise"></div>
    <div class="heaven" id="heaven" aria-hidden="true">
      <div class="hsky" id="hsky"></div>

/* ───────── 日付（ローカル固定・UTCずれなし） ───────── */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
function dayOf(iso){var d=new Date(iso);return isNaN(d)?'':ymd(d)}
function nowIso(){
  var d=new Date(),o=-d.getTimezoneOffset(),s=o<0?'-':'+',a=Math.abs(o);
  return ymd(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')
    +s+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0');
}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

/* ───────── 保存 ───────── */
function blank(){return {version:1,captures:[],habits:[],reservations:[],notes:[]}}

/* localStorage が使えない文脈（プライベートモード、埋め込み枠内）でも落ちない。
   その場合だけメモリに置き、一度だけ「残らない」ことを伝える。 */
var mem={},volatile=false,warned=false;
var store={
  get:function(k){try{return localStorage.getItem(k)}catch(e){volatile=true;return k in mem?mem[k]:null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){volatile=true;mem[k]=v}}
};

var state=(function load(){
  var raw=store.get(KEY);
  if(!raw)return blank();
  try{
    var s=JSON.parse(raw);
    if(!s||!Array.isArray(s.captures))throw new Error('shape');
    s.version=1;
    s.habits=Array.isArray(s.habits)?s.habits:[];
    s.reservations=Array.isArray(s.reservations)?s.reservations:[];
    s.notes=Array.isArray(s.notes)?s.notes:[];
    s.captures.forEach(function(c){
      c.pull=(typeof c.pull==='number'&&c.pull>0)?c.pull:1;
      c.kind=c.kind||'unknown';
      c.status=c.status||'inbox';
      c.text=String(c.text||'');
    });
    return s;
  }catch(e){
    store.set(KEY+'_backup_'+Date.now(),raw);
    setTimeout(function(){say('保存データを読めなかった。退避して新しく始める。')},400);
    return blank();
  }
})();
function save(){
  store.set(KEY,JSON.stringify(state));
  if(volatile&&!warned){warned=true;setTimeout(function(){say('この画面ではデータが残らない。ホーム画面に追加して使って。')},600)}

/* ───────── 通知 ───────── */

   丸を押す → そのまま書ける。声はキーボードのマイク（Appleの文字起こし）から入る。

];
var muse=$('muse'),museOn=false,deck=[],deckI=0;

function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}
  return a;
}
function nextMuse(){
  if(deckI>=deck.length){
    var last=deck.length?deck[deck.length-1]:null;
    deck=shuffle(MUSE.slice());
    if(last&&deck[0]===last)deck.push(deck.shift());   // ひと巡りした直後の重複を避ける
    deckI=0;
  }
  var m=deck[deckI++];
  $('mWho').textContent=m.who;
  $('mWhat').textContent=m.what;
  $('mNote').textContent=m.note;
  var c=$('mcard');c.classList.remove('in');void c.offsetWidth;c.classList.add('in');
}
function openMuse(){
  if(museOn)return;
  museOn=true;muse.classList.add('on');muse.setAttribute('aria-hidden','false');
  track.classList.add('lock');
  nextMuse();
}
function closeMuse(){
  if(!museOn)return;
  museOn=false;muse.classList.remove('on');muse.setAttribute('aria-hidden','true');
  track.classList.remove('lock');
}

/* 縦になぞったときだけ拾う。横は面の移動に残す */
var sy=0,sx=0,swiping=false;

  if(e.touches.length!==1){swiping=false;return}
  sy=e.touches[0].clientY;sx=e.touches[0].clientX;swiping=true;
},{passive:true});
throwPane.addEventListener('touchend',function(e){
  if(!swiping)return;swiping=false;
  var t=e.changedTouches[0],dy=t.clientY-sy,dx=t.clientX-sx;
  if(Math.abs(dy)<58||Math.abs(dy)<Math.abs(dx)*1.4)return;
  if(dy>0){ if(museOn)nextMuse(); else if(phase()==='idle')openMuse(); }
  else if(museOn)closeMuse();
},{passive:true});

// 手元のブラウザでも繰れるように
document.addEventListener('keydown',function(e){
  if(pane!==1)return;
  if(e.key==='ArrowDown'){ if(museOn)nextMuse(); else if(phase()==='idle')openMuse(); }

});

var hiddenAt=0;

/* 置いた言葉が箱の方角へ飛ぶ */
function flyToBox(text){
  if(reduced)return;
  var el=document.createElement('div');el.className='fly';
  el.textContent=text.length>10?text.slice(0,10)+'…':text;
  el.style.left='50%';el.style.top='50%';el.style.transform='translate(-50%,-50%) scale(1)';el.style.opacity='1';
  document.body.appendChild(el);
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    el.style.transform='translate('+(window.innerWidth*0.62)+'px,-52%) scale(.34)';
    el.style.opacity='0';
  })});

}

/* ───────── 箱 ───────── */
var jar=$('jar'),ghost=$('ghost');
var bubbles=[],W=0,H=0,raf=null,idleFrames=0;

/* 核になる語だけを抜く。形態素解析は積まない。

   漢字・カタカナ・英数の連なりを「語」とみなす。ひらがな1字を挟む複合語はつなぐ
   （編み物・買い物）。ただしその1字が助詞なら、そこは語の切れ目（陶芸を／海に）。

   どれを採るかは長さでは決めない。「歌が上手になりたい」では長い「上手」が勝ってしまう。
   日本語では欲しいものが「を」「が」で示されるので、そこを最優先で見る。
   加えて、程度や質を言うだけの語（上手・普通・大事…）は核になりにくいので下げる。 */
var STOP=['上手','下手','得意','苦手','普通','普段','大事','大切','必要','本当','一番','沢山','自体'];
// 「毎日走りたい」のように漢字が続くと切れ目がない。時を言う語だけ、前から切り離す
var WHEN=['毎日','毎朝','毎晩','毎週','毎月','毎年','今日','明日','明後日','来週','来月','今度','最近','今年'];

function keyword(t){
  var s=String(t).trim()
    .replace(/^(えっと|えーと|えー|あの|あのー|んー|なんか|そうだな|うーん|やっぱり|ちょっと|もっと)[、,。\s]*/,'')
    .replace(/[。、,.!?！？\s]+$/,'');
  var re=/[\u3005\u3006\u4E00-\u9FFF\u30A1-\u30FF\uFF66-\uFF9FA-Za-z0-9\uFF10-\uFF19]+/g;
  var runs=[],m;
  while((m=re.exec(s))!==null)runs.push({t:m[0],i:m.index,e:m.index+m[0].length,tail:null});
  if(!runs.length)return s.slice(0,6)||String(t).trim();

  var split=[];
  runs.forEach(function(r){
    for(var k=0;k<WHEN.length;k++){
      if(r.t.length>WHEN[k].length&&r.t.indexOf(WHEN[k])===0){
        split.push({t:WHEN[k],i:r.i,e:r.i+WHEN[k].length,tail:null});
        split.push({t:r.t.slice(WHEN[k].length),i:r.i+WHEN[k].length,e:r.e,tail:null});
        return;
      }
    }
    split.push(r);
  });
  runs=split;

  var PART='はがをにへとでもやかねよさなぞわ';
  var merged=[runs[0]];
  for(var i=1;i<runs.length;i++){
    var p=merged[merged.length-1],c=runs[i],sep=s.slice(p.e,c.i);
    var joinable=sep.length===1&&(sep==='の'||PART.indexOf(sep)<0);
    if(joinable&&(p.t+sep+c.t).length<=7)
      merged[merged.length-1]={t:p.t+sep+c.t,i:p.i,e:c.e,tail:c.t};
    else merged.push(c);
  }

  var best=null,top=-1e9;
  for(var j=0;j<merged.length;j++){
    var g=merged[j];
    // 直後が「を」「が」なら、それが欲しいもの。送りがな1字は語に含める（早起き＋が）
    var mk=/^([\u3041-\u3096]?)[をが]/.exec(s.slice(g.e));
    var word=g.t+(mk?mk[1]:'');
    var score=word.length+(mk?100:0)-(STOP.indexOf(g.t)>=0?5:0);
    if(score>top){top=score;best={t:word,tail:g.tail}}
  }

  var w=best.t;
  if(w.length>7&&best.tail)w=best.tail;   // 「の」で伸びすぎたら頭の名詞だけ
  return w.length>8?w.slice(0,8):w;
}

function radius(c){
  var base=30+9*Math.sqrt(Math.max(1,c.pull)-1)*1.7;
  var len=Math.min(keyword(c.text).length,26)*0.55;
  return Math.max(30,Math.min(76,base+len));
}
function measure(){W=jar.clientWidth;H=jar.clientHeight}

function build(){
  measure();
  var live=state.captures.filter(function(c){return c.status==='inbox'||c.status==='resting'});
  var prev={};bubbles.forEach(function(b){prev[b.id]=b});
  jar.querySelectorAll('.bub').forEach(function(n){n.remove()});
  bubbles=live.map(function(c){
    var r=radius(c),o=prev[c.id];
    var el=document.createElement('button');
    el.className='bub';el.style.width=el.style.height=(r*2)+'px';
    el.style.setProperty('--a',(0.032+Math.min(0.078,(Math.max(1,c.pull)-1)*0.013)).toFixed(3));
    el.innerHTML=label(keyword(c.text),r);
    el.setAttribute('aria-label',c.text);
    el.addEventListener('click',function(){openCard(c.id)});
    jar.appendChild(el);
    if(!o)el.classList.add('fresh');
    var b={id:c.id,el:el,r:r,x:o?o.x:0,y:o?o.y:0,vx:o?o.vx:0,vy:o?o.vy:0};
    if(!o)seed(b);
    return b;
  });
  ghost.hidden=live.length>0;
  if(skyOn)drawHeaven();
  idleFrames=0;
  layout();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]})}

/* 円に内接する正方形の中へ、行数と字数から逆算して文字を収める */
function label(k,r){
  var t=k.length>8?k.slice(0,8)+'…':k;
  var side=r*1.34;
  var cols=Math.ceil(Math.sqrt(t.length));
  var rows=Math.ceil(t.length/cols);
  var fs=Math.min(side/cols,side/(rows*1.16))*0.95;
  fs=Math.max(9.5,Math.min(30,fs));
  return '<b style="font-size:'+fs.toFixed(1)+'px;width:'+Math.round(side)+'px">'+esc(t)+'</b>';
}

/* 浮遊：中心への弱い引力＋反発＋減衰 */
function step(){
  var cx=W/2,cy=H*0.46,moved=0;
  for(var i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    b.vx+=(cx-b.x)*0.0024;b.vy+=(cy-b.y)*0.0024;
    if(!reduced){b.vx+=(Math.random()-.5)*0.06;b.vy+=(Math.random()-.5)*0.06}
    for(var j=i+1;j<bubbles.length;j++){
      var a=bubbles[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||0.01,min=b.r+a.r+7;
      if(d<min){var f=(min-d)/d*0.16;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
    }
  }
  for(var k=0;k<bubbles.length;k++){
    var p=bubbles[k];
    p.vx*=0.88;p.vy*=0.88;p.x+=p.vx;p.y+=p.vy;
    p.x=Math.max(p.r+6,Math.min(W-p.r-6,p.x));
    p.y=Math.max(p.r+6,Math.min(H-p.r-6,p.y));
    p.el.style.transform='translate3d('+(p.x-p.r)+'px,'+(p.y-p.r)+'px,0)';
    moved+=Math.abs(p.vx)+Math.abs(p.vy);
  }
  idleFrames=moved<0.35*Math.max(1,bubbles.length)?idleFrames+1:0;
  raf=(idleFrames>90||reduced&&idleFrames>4)?null:requestAnimationFrame(step);
}
function seed(b){
  b.x=W/2+(Math.random()-.5)*Math.min(W*0.62,210);
  b.y=H*0.44+(Math.random()-.5)*Math.min(H*0.5,190);
  b.vx=b.vy=0;
}
function layout(){
  measure();
  if(!bubbles.length||!W||!H)return;
  bubbles.forEach(function(b){
    if(!isFinite(b.x)||b.x<b.r||b.x>W-b.r||b.y<b.r||b.y>H-b.r)seed(b);
  });
  idleFrames=0;
  if(!raf)raf=requestAnimationFrame(step);
}
if(window.ResizeObserver)new ResizeObserver(function(){layout()}).observe(jar);

/* ───────── 天国 ─────────
   行動へ送り終えたものが、白い空をゆっくり昇り続ける層。箱の面を下から上へなぞると開く。
   減っていく箱と、増えていく空を対にする。 */
var heaven=$('heaven'),hsky=$('hsky'),skyOn=false,souls=[],SW2=0,SH2=0,sraf=null;

function drawHeaven(){
  var done=state.captures.filter(function(c){return c.status==='growing'||c.status==='reserved'})
    .sort(function(a,b){return (a.updatedAt||'').localeCompare(b.updatedAt||'')});
  $('hCount').textContent=done.length;
  $('hEmpty').hidden=done.length>0;
  hsky.innerHTML='';
  SW2=hsky.clientWidth;SH2=hsky.clientHeight;
  if(!SW2||!SH2)return;
  souls=done.map(function(c,i){
    var k=keyword(c.text);
    var r=Math.max(26,Math.min(64,24+Math.sqrt(Math.max(1,c.pull||1))*8+Math.min(k.length,10)*0.9));
    var el=document.createElement('button');
    el.className='hb';el.style.width=el.style.height=(r*2)+'px';
    el.style.setProperty('--a',(0.035+Math.min(0.075,((c.pull||1)-1)*0.012)).toFixed(3));
    el.innerHTML=label(k,r);
    el.setAttribute('aria-label',c.text);
    el.addEventListener('click',function(){openCard(c.id)});
    hsky.appendChild(el);
    return {el:el,r:r,
      x:r+10+Math.random()*Math.max(1,SW2-2*r-20),
      y:SH2+r-((i+0.5)/done.length)*(SH2+2*r),
      v:reduced?0:0.14+Math.random()*0.2,
      ph:Math.random()*6.283};
  });
  placeSouls();
  if(!reduced&&skyOn&&!sraf)sraf=requestAnimationFrame(skyStep);
}
function placeSouls(){
  for(var i=0;i<souls.length;i++){
    var s=souls[i],x=s.x+Math.sin(s.ph)*11;
    s.el.style.transform='translate3d('+(x-s.r)+'px,'+(s.y-s.r)+'px,0)';
  }
}
function skyStep(){
  for(var i=0;i<souls.length;i++){
    var s=souls[i];s.y-=s.v;s.ph+=0.011;
    if(s.y<-s.r-12)s.y=SH2+s.r+12;      // 天井を抜けたら、また下から昇り直す
  }
  placeSouls();
  sraf=skyOn?requestAnimationFrame(skyStep):null;
}
function openSky(){
  if(skyOn)return;skyOn=true;
  heaven.classList.add('on');heaven.setAttribute('aria-hidden','false');
  document.body.classList.add('sky');track.classList.add('lock');
  drawHeaven();
}
function closeSky(){
  if(!skyOn)return;skyOn=false;
  heaven.classList.remove('on');heaven.setAttribute('aria-hidden','true');
  document.body.classList.remove('sky');track.classList.remove('lock');
}

/* 箱の面：下から上へなぞると空へ、上から下へなぞると箱へ */
var boxPane=$('box'),by=0,bx=0,bsw=false;
boxPane.addEventListener('touchstart',function(e){
  if(e.touches.length!==1||card.classList.contains('on')){bsw=false;return}
  by=e.touches[0].clientY;bx=e.touches[0].clientX;bsw=true;
},{passive:true});
boxPane.addEventListener('touchend',function(e){
  if(!bsw)return;bsw=false;
  var t=e.changedTouches[0],dy=t.clientY-by,dx=t.clientX-bx;
  if(Math.abs(dy)<58||Math.abs(dy)<Math.abs(dx)*1.4)return;
  if(dy<0)openSky();else closeSky();
},{passive:true});
document.addEventListener('keydown',function(e){
  if(pane!==2||card.classList.contains('on'))return;
  if(e.key==='ArrowUp')openSky();
  else if(e.key==='ArrowDown'||e.key==='Escape')closeSky();
});
if(window.ResizeObserver)new ResizeObserver(function(){if(skyOn)drawHeaven()}).observe(hsky);

/* ───────── 種のカード ───────── */
var card=$('card'),disc=$('disc'),route=$('route'),cHint=$('cHint'),cur=null;
function find(id){return state.captures.filter(function(c){return c.id===id})[0]}
function openCard(id){
  var c=find(id);if(!c)return;
  cur=c;
  var n=c.text.length;
  $('cText').textContent=c.text;
  $('cText').style.fontSize=(n>96?14.5:n>56?16.5:n>30?19:21)+'px';
  var sent=(c.status==='growing'||c.status==='reserved');
  route.innerHTML='';
  if(sent){
    var back=document.createElement('button');back.className='toP';
    back.textContent='back';back.addEventListener('click',function(){back2box(c)});
    route.appendChild(back);
    cHint.textContent=(c.status==='growing'?'habit':'plan');
    route.classList.add('on');
  }else{
    var h=document.createElement('button');h.className='toH';h.textContent='habit';
    h.addEventListener('click',function(){send(c,'habit')});
    var p=document.createElement('button');p.className='toP';p.textContent='plan';
    p.addEventListener('click',function(){send(c,'plan')});
    route.appendChild(h);route.appendChild(p);
    cHint.textContent='turn';
    route.classList.remove('on');
  }
  card.classList.remove('gone');
  card.classList.add('on');track.classList.add('lock');
  rot=0;disc.style.setProperty('--rot','0deg');
  applyDial();
}
function closeCard(){
  card.classList.remove('on');card.classList.remove('gone');
  track.classList.remove('lock');cur=null;
  build();drawDash();if(skyOn)drawHeaven();
}
/* 昔のクリックホイールと同じ。右（時計回り）へ回すと大きく、左へ回すと小さく。
   ほとんど回さずに離したときだけ、押したものとして扱う。 */
var dialing=false,lastAng=0,accum=0,turned=0,rot=0,pull0=1;
var STEP=16;                       // 16°で1目盛り
function discAng(e){
  var r=disc.getBoundingClientRect();
  return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;
}
function applyDial(){
  if(!cur)return;
  var p=Math.max(1,Math.min(20,cur.pull||1));
  disc.style.setProperty('--s',(0.62+Math.min(p,16)/16*0.44).toFixed(3));
  $('cWhen').textContent=(dayOf(cur.createdAt)||'').replace(/-/g,'.')+'  ·  want '+p;
}
function tapDisc(){
  if(!cur)return;
  if(!route.classList.contains('on')){route.classList.add('on');cHint.textContent='where'}
  else if(cur.status==='inbox'||cur.status==='resting'){route.classList.remove('on');cHint.textContent='turn'}
}
disc.addEventListener('pointerdown',function(e){
  if(!cur)return;
  dialing=true;accum=0;turned=0;lastAng=discAng(e);pull0=cur.pull||1;
  disc.classList.add('turning');
  try{disc.setPointerCapture(e.pointerId)}catch(_){}
});
disc.addEventListener('pointermove',function(e){
  if(!dialing||!cur)return;
  var a=discAng(e),d=a-lastAng;
  if(d>180)d-=360;else if(d<-180)d+=360;
  lastAng=a;accum+=d;turned+=Math.abs(d);rot+=d;
  disc.style.setProperty('--rot',rot.toFixed(1)+'deg');
  var steps=(accum/STEP)|0;
  if(steps!==0){
    accum-=steps*STEP;
    var np=Math.max(1,Math.min(20,(cur.pull||1)+steps));
    if(np!==cur.pull){
      cur.pull=np;applyDial();
      if(navigator.vibrate)try{navigator.vibrate(4)}catch(_){}
    }
  }
});
['pointerup','pointercancel'].forEach(function(ev){
  disc.addEventListener(ev,function(){
    if(!dialing)return;
    dialing=false;disc.classList.remove('turning');
    if(cur&&cur.pull!==pull0){cur.updatedAt=nowIso();save()}
    if(turned<7)tapDisc();
  });
});
card.addEventListener('click',function(e){if(e.target===card)closeCard()});

/* 送った瞬間の見せ場。円が弾けて、語がひとつ上へ抜けていく */
function burst(){
  if(reduced)return;
  var dr=disc.getBoundingClientRect(),cr=card.getBoundingClientRect();
  var b=document.createElement('div');b.className='burst';
  b.style.left=(dr.left-cr.left+dr.width/2)+'px';
  b.style.top=(dr.top-cr.top+dr.height/2)+'px';
  for(var i=0;i<22;i++){
    var ang=(i/22)*6.283+Math.random()*0.28,d=90+Math.random()*150,sz=3+Math.random()*5;
    var x=document.createElement('i');
    x.style.width=x.style.height=sz.toFixed(1)+'px';
    x.style.margin=(-sz/2).toFixed(1)+'px 0 0 '+(-sz/2).toFixed(1)+'px';
    x.style.setProperty('--dx',(Math.cos(ang)*d).toFixed(0)+'px');
    x.style.setProperty('--dy',(Math.sin(ang)*d-46).toFixed(0)+'px');
    x.style.animationDelay=(Math.random()*0.07).toFixed(3)+'s';
    b.appendChild(x);
  }
  card.appendChild(b);
  setTimeout(function(){b.remove()},1100);
}
function ascend(text){
  if(reduced)return;
  var dr=disc.getBoundingClientRect(),cr=card.getBoundingClientRect();
  var el=document.createElement('div');el.className='soul';
  el.style.left=(dr.left-cr.left+dr.width/2)+'px';
  el.style.top=(dr.top-cr.top+dr.height/2)+'px';
  var k=keyword(text);
  el.textContent=k.length>10?k.slice(0,10)+'…':k;
  card.appendChild(el);
  setTimeout(function(){el.remove()},1400);
}

function send(c,to){
  var t=nowIso();
  if(to==='habit'){
    c.status='growing';
    state.habits.push({id:'h'+uid(),captureId:c.id,title:c.text,cue:'',action:'',
      dailyLogs:[],targetCount:7,windowDays:10,status:'active',createdAt:t,completedAt:null});
  }else{
    c.status='reserved';
    state.reservations.push({id:'r'+uid(),captureId:c.id,title:c.text,url:'',
      nextAction:'',status:'candidate',createdAt:t});
  }
  c.updatedAt=t;save();
  if(navigator.vibrate)try{navigator.vibrate([14,40,20])}catch(e){}
  burst();ascend(c.text);
  card.classList.add('gone');
  setTimeout(function(){closeCard();say(to==='habit'?'habit':'plan')},reduced?160:900);
}
function back2box(c){
  state.habits=state.habits.filter(function(h){return h.captureId!==c.id});
  state.reservations=state.reservations.filter(function(r){return r.captureId!==c.id});
  c.status='inbox';c.updatedAt=nowIso();save();closeCard();say('back');
}
$('cDel').addEventListener('click',function(e){
  e.stopPropagation();if(!cur)return;
  var c=cur;
  say('forget?','yes',function(){
    state.captures=state.captures.filter(function(x){return x.id!==c.id});
    state.habits=state.habits.filter(function(h){return h.captureId!==c.id});
    state.reservations=state.reservations.filter(function(r){return r.captureId!==c.id});
    save();closeCard();
  });
});

/* ───────── 記録 ───────── */
function drawDash(){
  var days=[],d=new Date();
  for(var i=13;i>=0;i--){var t=new Date(d);t.setDate(d.getDate()-i);days.push(ymd(t))}
  var counts=days.map(function(day){
    return state.captures.filter(function(c){return dayOf(c.createdAt)===day}).length;
  });
  var max=Math.max.apply(null,counts.concat([1]));
  var inbox=state.captures.filter(function(c){return c.status==='inbox'||c.status==='resting'}).length;
  var toH=state.captures.filter(function(c){return c.status==='growing'}).length;
  var toP=state.captures.filter(function(c){return c.status==='reserved'}).length;
  var sent=state.captures.filter(function(c){return c.status==='growing'||c.status==='reserved'})
    .sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'')}).slice(0,5);

  var bars=counts.map(function(n,i){
    var isNow=i===13,h=n===0?1:Math.round(8+(n/max)*88);
    return '<div class="'+(n===0?'zero':isNow?'now':'')+'" style="height:'+h+'px" title="'+days[i]+' '+n+'"></div>';
  }).join('');

  $('dashBody').innerHTML=
    '<h1 class="h">days</h1>'+
    '<div class="today"><b>'+counts[13]+'</b><span>today</span></div>'+
    '<div class="chart">'+bars+'</div>'+
    '<div class="axis"><span>'+days[0].slice(5).replace('-','.')+'</span><span></span><span>'+days[13].slice(5).replace('-','.')+'</span></div>'+
    '<div class="stats">'+
      '<div><b>'+inbox+'</b><span>held</span></div>'+
      '<div><b>'+toH+'</b><span>habit</span></div>'+
      '<div><b>'+toP+'</b><span>plan</span></div>'+
    '</div>'+
    '<div class="recent">'+(sent.length
      ? sent.map(function(c){return '<div class="r"><p>'+esc(c.text)+'</p><em>'+(c.status==='growing'?'habit':'plan')+'</em></div>'}).join('')
      : '<p class="empty">quiet</p>')+
    '</div>'+
    '<div class="dfoot"><button id="exp">export</button><span>'+state.captures.length+' kept</span></div>';

  drawNotes();
  var exp=$('exp');
  if(exp)exp.addEventListener('click',function(){
    var json=JSON.stringify(state,null,2);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(function(){say('copied')},function(){say('コピーできなかった')});
    }else say('コピーに対応していない');
  });
}

/* ───────── メモ ─────────
   あとで直すためのヒントを溜める枠。記録の面のいちばん下。 */
function drawNotes(){
  var list=$('mList');list.innerHTML='';
  (state.notes||[]).slice().reverse().forEach(function(n){
    var b=document.createElement('button');b.className='mItem';
    b.innerHTML='<p></p><em>'+(dayOf(n.createdAt)||'').slice(5).replace('-','.')+'</em>';
    b.querySelector('p').textContent=n.text;
    b.addEventListener('click',function(){
      say('forget?','yes',function(){
        state.notes=state.notes.filter(function(x){return x.id!==n.id});
        save();drawNotes();
      });
    });
    list.appendChild(b);
  });
}
$('mAdd').addEventListener('click',function(){
  var el=$('mIn'),t=(el.value||'').trim();
  if(!t){say('ひとことだけでも');return}
  state.notes.push({id:'n'+uid(),text:t,createdAt:nowIso()});
  save();el.value='';try{el.blur()}catch(e){}
  drawNotes();say('kept');
});

/* ───────── 起動 ───────── */
goPane(1,false);
setTimeout(function(){goPane(1,false);measure();build();drawDash()},60);
window.addEventListener('load',function(){goPane(1,false);measure();build()});
build();drawDash();
})();
</script>
