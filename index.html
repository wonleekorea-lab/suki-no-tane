<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>好きの種</title>
<meta name="description" content="ふっと浮かんだ「やってみたい」を、声に出して投げ込む箱。">
<meta name="theme-color" content="#08080A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="好きの種">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192-v2.png">
<style>html,body{background:#08080A}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@300;400;500&display=swap">
<style>
/* ── 単一テーマの意図的な確定：夜の散歩の画面。黒地・白・白の透明度のみ ── */
:root{
  color-scheme: dark;
  --void:#08080A;
  --void2:#0E0E12;
  --lume:#FAFAF7;
  --l86:rgba(250,250,247,.86);
  --l58:rgba(250,250,247,.58);
  --l40:rgba(250,250,247,.40);
  --l26:rgba(250,250,247,.26);
  --l16:rgba(250,250,247,.16);
  --l09:rgba(250,250,247,.09);
  --l05:rgba(250,250,247,.05);
  --f:"M PLUS 2",-apple-system,'Hiragino Sans','Helvetica Neue',sans-serif;
  --ease:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--void);color:var(--lume);font-family:var(--f);overscroll-behavior:none}
body{font-size:15px;font-weight:400;line-height:1.7;letter-spacing:.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--l58);outline-offset:3px}

/* ── 3面トラック：左=記録 中央=投げる 右=箱 ── */
.track{display:flex;height:100dvh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track.lock{overflow-x:hidden}
.pane{position:relative;flex:0 0 100%;height:100dvh;scroll-snap-align:center;scroll-snap-stop:always;overflow:hidden}

/* ── 面の位置を示す3点（文字を置かないための唯一の道標） ── */
.dots{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:7px;justify-content:center;z-index:40;pointer-events:none}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--l16);transition:background .3s,width .3s var(--ease)}
.dots i.on{background:var(--l58);width:14px;border-radius:2px}

/* ── 投げる ──
   丸ひとつが最初から最後まで唯一の操作。上に覆いをかぶせて押せなくしない。
   idle = 白い円 ／ live = 白い輪＋波紋 ／ confirm = 小さくなって「言い直す」 */
#throw{display:grid;place-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.stage{display:flex;flex-direction:column;align-items:center;width:100%;padding:0 26px}

.said{width:100%;max-width:19em;text-align:center;text-wrap:balance;
  font-weight:300;font-size:clamp(20px,5.6vw,27px);line-height:1.55;letter-spacing:-.005em;
  max-height:0;opacity:0;margin-bottom:0;overflow:hidden;
  transition:max-height .34s var(--ease),opacity .24s,margin-bottom .34s var(--ease),color .3s}
.said:focus{outline:none}
.said:empty::before{content:"ここに書く";color:var(--l26)}
#throw[data-state="live"] .said,
#throw[data-state="confirm"] .said{max-height:42vh;opacity:1;margin-bottom:36px;overflow-y:auto}
#throw[data-state="live"] .said{color:var(--l58)}
#throw[data-state="confirm"] .said{border-bottom:1px solid var(--l09);padding-bottom:12px}

.orbwrap{position:relative;display:grid;place-items:center;flex:0 0 auto;
  width:min(62vw,250px);aspect-ratio:1;transition:width .38s var(--ease)}
#throw[data-state="confirm"] .orbwrap{width:min(28vw,108px)}
.orb{position:relative;z-index:2;width:100%;height:100%;border-radius:50%;border:0;
  background:var(--lume);touch-action:manipulation;
  animation:breathe 5.4s ease-in-out infinite;
  transition:transform .18s var(--ease),background .3s}
/* 聞いている間は中央が抜けて輪になる。暗くしない（暗い＝止まって見える） */
.orb::after{content:"";position:absolute;inset:50%;border-radius:50%;background:var(--void);
  transition:inset .32s var(--ease)}
.orb.press{transform:scale(.94)}
.orb.wait{background:var(--l26)}
#throw[data-state="live"] .orb{animation:none}
#throw[data-state="live"] .orb::after{inset:10px}
#throw[data-state="confirm"] .orb{animation:none;background:var(--lume)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.028)}}
.ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--l40);pointer-events:none;z-index:1;animation:spread 2.4s ease-out forwards}
@keyframes spread{from{transform:scale(1);opacity:.55}to{transform:scale(2.15);opacity:0}}

.acts{display:flex;align-items:center;gap:26px;max-height:0;opacity:0;margin-top:0;overflow:hidden;
  transition:max-height .3s var(--ease),opacity .24s,margin-top .3s var(--ease)}
#throw[data-state="confirm"] .acts{max-height:80px;opacity:1;margin-top:36px}
.place{min-height:52px;padding:0 40px;border-radius:26px;border:1px solid var(--l26);background:var(--l05);
  font-size:14px;font-weight:500;letter-spacing:.1em;transition:background .2s,border-color .2s}
.place:active{background:var(--l09);border-color:var(--l40)}
.drop{color:var(--l40);font-size:13px;letter-spacing:.06em}
.drop:active{color:var(--l86)}
/* 止め方は、聞いている間だけ出す */
.tip{position:absolute;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));
  text-align:center;font-size:11.5px;letter-spacing:.14em;color:var(--l26);
  opacity:0;pointer-events:none;transition:opacity .3s}
#throw[data-state="live"] .tip,
#throw[data-state="confirm"] .tip{opacity:1}

/* ── 種が箱へ飛ぶ ── */
.fly{position:fixed;z-index:60;pointer-events:none;font-family:var(--f);font-size:16px;color:var(--l86);
  white-space:nowrap;transition:transform .62s var(--ease),opacity .62s ease-in}

/* ── 箱 ── */
#box{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.jar{position:relative;flex:1 1 auto;min-height:0}
.bub{position:absolute;top:0;left:0;display:grid;place-items:center;border-radius:50%;
  border:1px solid var(--l16);background:rgba(250,250,247,var(--a,.04));
  font-family:var(--f);color:var(--l86);text-align:center;padding:0;overflow:hidden;
  will-change:transform;transition:border-color .3s,opacity .4s,filter .3s}
.bub b{font-weight:400;display:block;line-height:1.16;word-break:break-all;margin:0 auto}
.bub:active{--a:.17;border-color:var(--l40)}
.ghost{position:absolute;inset:0;display:grid;place-items:center;gap:0;pointer-events:none}
.ghost[hidden]{display:none}
.ghost span{font-size:12.5px;color:var(--l26);letter-spacing:.16em}
.ghost svg{position:absolute;opacity:.5}

/* 沈殿層：行動へ送り終えたもの */
.sed{flex:0 0 auto;border-top:1px solid var(--l09);padding:13px 16px calc(30px + env(safe-area-inset-bottom));
  display:flex;gap:9px;overflow-x:auto;align-items:center;scrollbar-width:none}
.sed::-webkit-scrollbar{display:none}
.sed:empty{display:none}
.sed .s{flex:0 0 auto;height:34px;padding:0 15px;border-radius:17px;font-family:var(--f);font-size:12.5px;
  color:var(--l40);white-space:nowrap;display:flex;align-items:center;gap:8px}
.sed .s.habit{border:1px solid var(--l16)}
.sed .s.plan{border:1px dashed var(--l26)}
.sed .s em{font-style:normal;font-size:10px;letter-spacing:.14em;color:var(--l26)}

/* 種のカード */
.card{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding:0 22px calc(46px + env(safe-area-inset-bottom));background:rgba(8,8,10,.78);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .26s}
.card.on{opacity:1;pointer-events:auto}
.disc{width:min(76vw,320px);aspect-ratio:1;border-radius:50%;border:1px solid var(--l16);
  background:var(--l05);display:grid;place-items:center;padding:13%;transform:scale(.8);opacity:0;
  transition:transform .36s var(--ease),opacity .3s}
.card.on .disc{transform:scale(1);opacity:1}
.disc p{margin:0;font-family:var(--f);font-weight:300;font-size:clamp(17px,4.9vw,21px);line-height:1.62;letter-spacing:-.005em;text-align:center;text-wrap:balance}
.disc .when{margin-top:12px;font-family:var(--f);font-size:10.5px;letter-spacing:.16em;color:var(--l26);font-variant-numeric:tabular-nums}
.route{display:flex;gap:12px;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .28s,transform .28s var(--ease)}
.route.on{opacity:1;transform:none;pointer-events:auto}
.route button{min-height:48px;padding:0 22px;font-size:14px;letter-spacing:.06em;border-radius:24px}
.route .toH{border:1px solid var(--l40);background:var(--l05)}
.route .toP{border:1px dashed var(--l40)}
.cfoot{display:flex;gap:20px;color:var(--l26);font-size:12px;letter-spacing:.06em}
.cfoot button:active{color:var(--l86)}
.hint{font-size:11.5px;letter-spacing:.14em;color:var(--l26)}

/* ── 記録 ── */
#dash{overflow-y:auto;padding:calc(34px + env(safe-area-inset-top)) 22px calc(56px + env(safe-area-inset-bottom))}
.h{font-size:11px;font-weight:500;letter-spacing:.2em;margin:0 0 30px;color:var(--l40)}
.today{display:flex;align-items:baseline;gap:11px;margin-bottom:32px}
.today b{font-family:var(--f);font-weight:300;font-size:66px;line-height:.88;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.today span{font-size:12px;letter-spacing:.12em;color:var(--l40)}
.chart{display:flex;align-items:flex-end;gap:4px;height:96px;border-bottom:1px solid var(--l09);padding-bottom:0}
.chart div{flex:1;min-width:0;background:var(--l16);border-radius:1px 1px 0 0;transition:height .5s var(--ease),background .3s}
.chart div.now{background:var(--l86)}
.chart div.zero{height:1px !important;background:var(--l09)}
.axis{display:flex;justify-content:space-between;margin-top:9px;font-size:10px;letter-spacing:.1em;color:var(--l26);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:34px 0 0;border-top:1px solid var(--l09)}
.stats div{padding:17px 0 0}
.stats b{display:block;font-family:var(--f);font-weight:300;font-size:32px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats span{display:block;margin-top:8px;font-size:11px;letter-spacing:.1em;color:var(--l40)}
.recent{margin-top:38px;border-top:1px solid var(--l09);padding-top:6px}
.recent .r{display:flex;align-items:baseline;gap:12px;padding:13px 0;border-bottom:1px solid var(--l05)}
.recent .r p{margin:0;flex:1;font-family:var(--f);font-size:14.5px;color:var(--l58);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent .r em{font-style:normal;font-size:10px;letter-spacing:.14em;color:var(--l26);flex:0 0 auto}
.empty{font-size:13px;color:var(--l26);letter-spacing:.04em}
.dfoot{margin-top:40px;display:flex;gap:20px;font-size:11.5px;letter-spacing:.08em;color:var(--l26)}
.dfoot button:active{color:var(--l86)}

/* ── 通知 ── */
.toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom));transform:translate(-50%,14px);z-index:70;
  display:flex;align-items:center;gap:16px;max-width:88vw;padding:11px 18px;border-radius:23px;
  border:1px solid var(--l16);background:rgba(14,14,18,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-size:12.5px;letter-spacing:.04em;color:var(--l86);opacity:0;pointer-events:none;transition:opacity .24s,transform .24s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--l58);font-size:12px;letter-spacing:.08em;flex:0 0 auto}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.06s !important}
}
</style>

<main class="track" id="track">
  <section class="pane" id="dash" aria-label="記録"></section>

  <section class="pane" id="throw" aria-label="投げる" data-state="idle">
    <div class="stage">
      <div class="said" id="heard" contenteditable="true" role="textbox" aria-label="聞き取った内容"></div>
      <div class="orbwrap" id="orbwrap">
        <button class="orb" id="orb" aria-label="押して、声に出す"></button>
      </div>
      <div class="acts">
        <button class="place" id="place">置く</button>
        <button class="drop" id="drop">やめる</button>
      </div>
    </div>
    <div class="tip" id="tip"></div>
  </section>

  <section class="pane" id="box" aria-label="箱">
    <div class="jar" id="jar">
      <div class="ghost" id="ghost" hidden>
        <svg width="230" height="150" viewBox="0 0 230 150" aria-hidden="true">
          <circle cx="70" cy="62" r="34" fill="none" stroke="rgba(250,250,247,.16)"></circle>
          <circle cx="148" cy="48" r="22" fill="none" stroke="rgba(250,250,247,.13)"></circle>
          <circle cx="126" cy="106" r="27" fill="none" stroke="rgba(250,250,247,.10)"></circle>
        </svg>
        <span>ここに溜まる</span>
      </div>
    </div>
    <div class="sed" id="sed"></div>
    <div class="card" id="card">
      <div class="disc" id="disc">
        <div>
          <p id="cText"></p>
          <div class="when" id="cWhen"></div>
        </div>
      </div>
      <div class="hint" id="cHint">もう一度おす</div>
      <div class="route" id="route">
        <button class="toH" id="toH">習慣にする</button>
        <button class="toP" id="toP">予定にする</button>
      </div>
      <div class="cfoot">
        <button id="cPull">もっと惹かれる</button>
        <button id="cDel">そっと消す</button>
      </div>
    </div>
  </section>
</main>

<div class="dots" id="dots"><i></i><i class="on"></i><i></i></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var KEY='suki_no_tane_state_v1';
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── 日付（ローカル固定・UTCずれなし） ───────── */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){return ymd(new Date())}
function dayOf(iso){var d=new Date(iso);return isNaN(d)?'':ymd(d)}
function nowIso(){
  var d=new Date(),o=-d.getTimezoneOffset(),s=o<0?'-':'+',a=Math.abs(o);
  return ymd(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')
    +s+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0');
}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}

/* ───────── 保存 ───────── */
function blank(){return {version:1,captures:[],habits:[],reservations:[]}}

/* localStorage が使えない文脈（プライベートモード、埋め込み枠内）でも落ちない。
   その場合だけメモリに置き、一度だけ「残らない」ことを伝える。 */
var mem={},volatile=false,warned=false;
var store={
  get:function(k){try{return localStorage.getItem(k)}catch(e){volatile=true;return k in mem?mem[k]:null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){volatile=true;mem[k]=v}}
};

var state=(function load(){
  var raw=store.get(KEY);
  if(!raw)return blank();
  try{
    var s=JSON.parse(raw);
    if(!s||!Array.isArray(s.captures))throw new Error('shape');
    s.version=1;
    s.habits=Array.isArray(s.habits)?s.habits:[];
    s.reservations=Array.isArray(s.reservations)?s.reservations:[];
    s.captures.forEach(function(c){
      c.pull=(typeof c.pull==='number'&&c.pull>0)?c.pull:1;
      c.kind=c.kind||'unknown';
      c.status=c.status||'inbox';
      c.text=String(c.text||'');
    });
    return s;
  }catch(e){
    store.set(KEY+'_backup_'+Date.now(),raw);
    setTimeout(function(){say('保存データを読めなかった。退避して新しく始める。')},400);
    return blank();
  }
})();
function save(){
  store.set(KEY,JSON.stringify(state));
  if(volatile&&!warned){warned=true;setTimeout(function(){say('この画面ではデータが残らない。ホーム画面に追加して使って。')},600)}
}

/* ───────── 通知 ───────── */
var toast=$('toast'),toastMsg=$('toastMsg'),toastAct=$('toastAct'),toastT=null;
function say(msg,actLabel,actFn){
  toastMsg.textContent=msg;
  if(actLabel){toastAct.hidden=false;toastAct.textContent=actLabel;toastAct.onclick=function(){hideToast();actFn()}}
  else{toastAct.hidden=true;toastAct.onclick=null}
  toast.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(hideToast,actLabel?5200:2600);
}
function hideToast(){toast.classList.remove('on')}

/* ───────── 面の移動 ───────── */
var track=$('track'),dots=$('dots').children,pane=1;
function goPane(i,smooth){track.scrollTo({left:track.clientWidth*i,behavior:smooth===false?'auto':'smooth'})}
function syncPane(){
  var w=track.clientWidth||1,i=Math.round(track.scrollLeft/w);
  i=Math.max(0,Math.min(2,i));
  if(i!==pane){pane=i;for(var k=0;k<3;k++)dots[k].classList.toggle('on',k===pane)}
  if(pane===0)drawDash();
  if(pane===2)layout();
}
track.addEventListener('scroll',syncPane,{passive:true});
// 画面幅が変わるとスクロール位置(px)の意味がずれる。いまの面に合わせ直す。
window.addEventListener('resize',function(){measure();layout();goPane(pane,false);});

/* ───────── 投げる：丸ひとつで完結させる ─────────
   idle → 押す → live（聞いている）→ もう一度押す or 黙る → confirm（直して置く）
   丸は常に最前面にあり、どの状態でも押せる。 */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var throwPane=$('throw'),orb=$('orb'),orbwrap=$('orbwrap'),heard=$('heard');
var rec=null,ringT=null,useVoice=!!SR;

function phase(){return throwPane.getAttribute('data-state')}
function setState(s){
  throwPane.setAttribute('data-state',s);
  track.classList.toggle('lock',s!=='idle');   // 録りかけで横に流れていかないように
  var label=s==='live'?'押して、止める'
    :s==='confirm'?(useVoice?'押して、言い直す':'押して、書きなおす')
    :'押して、声に出す';
  orb.setAttribute('aria-label',label);
  $('tip').textContent=s==='live'?'もう一度おして、止める'
    :s==='confirm'?(useVoice?'おして、言い直す':'おして、書きなおす'):'';
  if(s==='idle')heard.textContent='';
}

function ring(){
  if(reduced)return;
  var r=document.createElement('div');r.className='ring';orbwrap.appendChild(r);
  setTimeout(function(){r.remove()},2500);
}
function startRings(){stopRings();ring();ringT=setInterval(ring,760)}
function stopRings(){clearInterval(ringT);ringT=null}

function stopListen(){
  stopRings();orb.classList.remove('wait');
  if(rec){try{rec.stop()}catch(e){}}
}

/* 声が使えないときは、同じ丸から手書きに落ちる。機能は止めない。 */
function toTyping(msg){
  useVoice=false;stopListen();setState('confirm');
  if(msg)say(msg);
  setTimeout(function(){try{heard.focus()}catch(e){}},300);
}

function startListen(){
  heard.textContent='';
  if(!useVoice){toTyping();return}
  try{rec=new SR()}catch(e){toTyping('音声を使えなかった。手で書ける。');return}
  rec.lang='ja-JP';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;

  // 許可待ちの間は live にしない。押した直後に「聞いている」と嘘をつかないため
  rec.onstart=function(){orb.classList.remove('wait');setState('live');startRings()};
  rec.onresult=function(ev){
    var t='';
    for(var i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;
    heard.textContent=t;ring();
  };
  rec.onerror=function(ev){
    stopRings();orb.classList.remove('wait');
    var e=ev.error;
    if(e==='not-allowed'||e==='service-not-allowed')toTyping('マイクを使えなかった。手で書ける。');
    else if(e==='no-speech'){setState('idle');say('聞こえなかった。もう一度。')}
    else if(e==='aborted'){/* こちらから止めた */}
    else toTyping('音声を認識できなかった。手で書ける。');
  };
  rec.onend=function(){
    stopRings();orb.classList.remove('wait');
    var t=(heard.textContent||'').trim();
    if(t)setState('confirm');
    else if(phase()!=='confirm'){setState('idle');say('聞こえなかった。もう一度。')}
  };
  try{
    orb.classList.add('wait');rec.start();
    if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
  }catch(e){orb.classList.remove('wait');toTyping('音声を始められなかった。手で書ける。')}
}

/* iOS の :active は指を置いた瞬間に効かないことがあるので、自前で押し込む */
orb.addEventListener('pointerdown',function(){orb.classList.add('press')});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  orb.addEventListener(ev,function(){orb.classList.remove('press')});
});
orb.addEventListener('click',function(){
  var s=phase();
  if(s==='live'){stopListen();return}
  if(s==='confirm'&&!useVoice){try{heard.focus()}catch(e){}return}  // 書いた字を消さない
  startListen();
});

$('drop').addEventListener('click',function(){stopListen();setState('idle')});
$('place').addEventListener('click',function(){
  var t=(heard.textContent||'').replace(/\s+/g,' ').trim();
  if(!t){say('ひとことだけでも置いてみよう');return}
  stopListen();
  var c={id:uid(),text:t,kind:'unknown',status:'inbox',pull:1,createdAt:nowIso(),updatedAt:nowIso()};
  state.captures.push(c);save();
  flyToBox(t);
  setState('idle');
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  say('置いた','取り消す',function(){
    var i=state.captures.map(function(x){return x.id}).indexOf(c.id);
    if(i>=0){state.captures.splice(i,1);save();build();drawDash()}
  });
  build();
});

/* 置いた言葉が箱の方角へ飛ぶ */
function flyToBox(text){
  if(reduced)return;
  var el=document.createElement('div');el.className='fly';
  el.textContent=text.length>10?text.slice(0,10)+'…':text;
  el.style.left='50%';el.style.top='50%';el.style.transform='translate(-50%,-50%) scale(1)';el.style.opacity='1';
  document.body.appendChild(el);
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    el.style.transform='translate('+(window.innerWidth*0.62)+'px,-52%) scale(.34)';
    el.style.opacity='0';
  })});
  setTimeout(function(){el.remove()},700);
}

/* ───────── 箱 ───────── */
var jar=$('jar'),sed=$('sed'),ghost=$('ghost');
var bubbles=[],W=0,H=0,raf=null,idleFrames=0;

/* 核になる語だけを抜く。形態素解析は積まない。
   漢字・カタカナ・英数の連なりを語とみなし、「の」でつながる語はひとつに束ねる。
   いちばん長い語を採る（同じ長さなら先に出たほう）。動詞は1字で残ることが多く、自然に負ける。 */
function keyword(t){
  var s=String(t).trim()
    .replace(/^(えっと|えーと|えー|あの|あのー|んー|なんか|そうだな|うーん|やっぱり|ちょっと)[、,。\s]*/,'')
    .replace(/[。、,.!?！？\s]+$/,'');
  var re=/[\u3005\u3006\u4E00-\u9FFF\u30A1-\u30FF\uFF66-\uFF9FA-Za-z0-9\uFF10-\uFF19]+/g;
  var runs=[],m;
  while((m=re.exec(s))!==null)runs.push({t:m[0],i:m.index,e:m.index+m[0].length,tail:null});
  if(!runs.length)return s.slice(0,6)||String(t).trim();
  // ひらがな1字を挟んで隣り合う語はつなぐ（編み物・買い物・夜の海）。
  // ただしその1字が助詞なら、そこは語の切れ目なのでつながない（陶芸を／海に）。
  var PART='はがをにへとでもやかねよさなぞわ';
  var merged=[runs[0]];
  for(var i=1;i<runs.length;i++){
    var p=merged[merged.length-1],c=runs[i],sep=s.slice(p.e,c.i);
    var joinable=sep.length===1&&(sep==='の'||PART.indexOf(sep)<0);
    if(joinable&&(p.t+sep+c.t).length<=7)
      merged[merged.length-1]={t:p.t+sep+c.t,i:p.i,e:c.e,tail:c.t};
    else merged.push(c);
  }
  var best=merged[0];
  for(var j=1;j<merged.length;j++)if(merged[j].t.length>best.t.length)best=merged[j];
  var w=best.t;
  if(w.length>7&&best.tail)w=best.tail;          // 「の」で伸びすぎたら頭の名詞だけ
  return w.length>8?w.slice(0,8):w;
}
function radius(c){
  var base=30+9*Math.sqrt(Math.max(1,c.pull)-1)*1.7;
  var len=Math.min(keyword(c.text).length,26)*0.55;
  return Math.max(30,Math.min(76,base+len));
}
function measure(){W=jar.clientWidth;H=jar.clientHeight}

function build(){
  measure();
  var live=state.captures.filter(function(c){return c.status==='inbox'||c.status==='resting'});
  var prev={};bubbles.forEach(function(b){prev[b.id]=b});
  jar.querySelectorAll('.bub').forEach(function(n){n.remove()});
  bubbles=live.map(function(c){
    var r=radius(c),o=prev[c.id];
    var el=document.createElement('button');
    el.className='bub';el.style.width=el.style.height=(r*2)+'px';
    el.style.setProperty('--a',(0.032+Math.min(0.078,(Math.max(1,c.pull)-1)*0.013)).toFixed(3));
    el.innerHTML=label(keyword(c.text),r);
    el.setAttribute('aria-label',c.text);
    el.addEventListener('click',function(){openCard(c.id)});
    jar.appendChild(el);
    var b={id:c.id,el:el,r:r,x:o?o.x:0,y:o?o.y:0,vx:o?o.vx:0,vy:o?o.vy:0};
    if(!o)seed(b);
    return b;
  });
  ghost.hidden=live.length>0;
  drawSed();
  idleFrames=0;
  layout();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]})}

/* 円に内接する正方形の中へ、行数と字数から逆算して文字を収める */
function label(k,r){
  var t=k.length>8?k.slice(0,8)+'…':k;
  var side=r*1.34;
  var cols=Math.ceil(Math.sqrt(t.length));
  var rows=Math.ceil(t.length/cols);
  var fs=Math.min(side/cols,side/(rows*1.16))*0.95;
  fs=Math.max(9.5,Math.min(30,fs));
  return '<b style="font-size:'+fs.toFixed(1)+'px;width:'+Math.round(side)+'px">'+esc(t)+'</b>';
}

/* 浮遊：中心への弱い引力＋反発＋減衰 */
function step(){
  var cx=W/2,cy=H*0.46,moved=0;
  for(var i=0;i<bubbles.length;i++){
    var b=bubbles[i];
    b.vx+=(cx-b.x)*0.0024;b.vy+=(cy-b.y)*0.0024;
    if(!reduced){b.vx+=(Math.random()-.5)*0.06;b.vy+=(Math.random()-.5)*0.06}
    for(var j=i+1;j<bubbles.length;j++){
      var a=bubbles[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||0.01,min=b.r+a.r+7;
      if(d<min){var f=(min-d)/d*0.16;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
    }
  }
  for(var k=0;k<bubbles.length;k++){
    var p=bubbles[k];
    p.vx*=0.88;p.vy*=0.88;p.x+=p.vx;p.y+=p.vy;
    p.x=Math.max(p.r+6,Math.min(W-p.r-6,p.x));
    p.y=Math.max(p.r+6,Math.min(H-p.r-6,p.y));
    p.el.style.transform='translate3d('+(p.x-p.r)+'px,'+(p.y-p.r)+'px,0)';
    moved+=Math.abs(p.vx)+Math.abs(p.vy);
  }
  idleFrames=moved<0.35*Math.max(1,bubbles.length)?idleFrames+1:0;
  raf=(idleFrames>90||reduced&&idleFrames>4)?null:requestAnimationFrame(step);
}
function seed(b){
  b.x=W/2+(Math.random()-.5)*Math.min(W*0.62,210);
  b.y=H*0.44+(Math.random()-.5)*Math.min(H*0.5,190);
  b.vx=b.vy=0;
}
function layout(){
  measure();
  if(!bubbles.length||!W||!H)return;
  bubbles.forEach(function(b){
    if(!isFinite(b.x)||b.x<b.r||b.x>W-b.r||b.y<b.r||b.y>H-b.r)seed(b);
  });
  idleFrames=0;
  if(!raf)raf=requestAnimationFrame(step);
}
if(window.ResizeObserver)new ResizeObserver(function(){layout()}).observe(jar);

function drawSed(){
  var done=state.captures.filter(function(c){return c.status==='growing'||c.status==='reserved'})
    .sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'')});
  sed.innerHTML='';
  done.forEach(function(c){
    var b=document.createElement('button');
    b.className='s '+(c.status==='growing'?'habit':'plan');
    var k=keyword(c.text);
    b.innerHTML='<em>'+(c.status==='growing'?'習慣':'予定')+'</em>'+esc(k.length>10?k.slice(0,10)+'…':k);
    b.addEventListener('click',function(){openCard(c.id)});
    sed.appendChild(b);
  });
}

/* ───────── 種のカード ───────── */
var card=$('card'),disc=$('disc'),route=$('route'),cHint=$('cHint'),cur=null;
function find(id){return state.captures.filter(function(c){return c.id===id})[0]}
function openCard(id){
  var c=find(id);if(!c)return;
  cur=c;
  $('cText').textContent=c.text;
  $('cWhen').textContent=(dayOf(c.createdAt)||'').replace(/-/g,'.')+(c.pull>1?'　惹かれ '+c.pull:'');
  var sent=(c.status==='growing'||c.status==='reserved');
  route.innerHTML='';
  if(sent){
    var back=document.createElement('button');back.className='toP';
    back.textContent='箱に戻す';back.addEventListener('click',function(){back2box(c)});
    route.appendChild(back);
    cHint.textContent=(c.status==='growing'?'習慣へ送ってある':'予定へ送ってある');
    route.classList.add('on');
  }else{
    var h=document.createElement('button');h.className='toH';h.textContent='習慣にする';
    h.addEventListener('click',function(){send(c,'habit')});
    var p=document.createElement('button');p.className='toP';p.textContent='予定にする';
    p.addEventListener('click',function(){send(c,'plan')});
    route.appendChild(h);route.appendChild(p);
    cHint.textContent='もう一度おす';
    route.classList.remove('on');
  }
  card.classList.add('on');track.classList.add('lock');
  if(!sent){c.pull=(c.pull||1)+1;c.updatedAt=nowIso();save()}
}
function closeCard(){card.classList.remove('on');track.classList.remove('lock');cur=null;build();drawDash()}
disc.addEventListener('click',function(e){
  e.stopPropagation();
  if(!cur)return;
  if(!route.classList.contains('on')){route.classList.add('on');cHint.textContent='どちらへ送る'}
  else if(cur.status==='inbox'||cur.status==='resting'){route.classList.remove('on');cHint.textContent='もう一度おす'}
});
card.addEventListener('click',function(e){if(e.target===card)closeCard()});

function send(c,to){
  var t=nowIso();
  if(to==='habit'){
    c.status='growing';
    state.habits.push({id:'h'+uid(),captureId:c.id,title:c.text,cue:'',action:'',
      dailyLogs:[],targetCount:7,windowDays:10,status:'active',createdAt:t,completedAt:null});
  }else{
    c.status='reserved';
    state.reservations.push({id:'r'+uid(),captureId:c.id,title:c.text,url:'',
      nextAction:'',status:'candidate',createdAt:t});
  }
  c.updatedAt=t;save();
  if(navigator.vibrate)try{navigator.vibrate(14)}catch(e){}
  closeCard();
  say(to==='habit'?'習慣へ送った':'予定へ送った');
}
function back2box(c){
  state.habits=state.habits.filter(function(h){return h.captureId!==c.id});
  state.reservations=state.reservations.filter(function(r){return r.captureId!==c.id});
  c.status='inbox';c.updatedAt=nowIso();save();closeCard();say('箱に戻した');
}
$('cPull').addEventListener('click',function(e){
  e.stopPropagation();if(!cur)return;
  cur.pull=(cur.pull||1)+2;cur.updatedAt=nowIso();save();
  $('cWhen').textContent=(dayOf(cur.createdAt)||'').replace(/-/g,'.')+'　惹かれ '+cur.pull;
  say('大きくした');
});
$('cDel').addEventListener('click',function(e){
  e.stopPropagation();if(!cur)return;
  var c=cur;
  say('消していい？','消す',function(){
    state.captures=state.captures.filter(function(x){return x.id!==c.id});
    state.habits=state.habits.filter(function(h){return h.captureId!==c.id});
    state.reservations=state.reservations.filter(function(r){return r.captureId!==c.id});
    save();closeCard();
  });
});

/* ───────── 記録 ───────── */
function drawDash(){
  var days=[],d=new Date();
  for(var i=13;i>=0;i--){var t=new Date(d);t.setDate(d.getDate()-i);days.push(ymd(t))}
  var counts=days.map(function(day){
    return state.captures.filter(function(c){return dayOf(c.createdAt)===day}).length;
  });
  var max=Math.max.apply(null,counts.concat([1]));
  var inbox=state.captures.filter(function(c){return c.status==='inbox'||c.status==='resting'}).length;
  var toH=state.captures.filter(function(c){return c.status==='growing'}).length;
  var toP=state.captures.filter(function(c){return c.status==='reserved'}).length;
  var sent=state.captures.filter(function(c){return c.status==='growing'||c.status==='reserved'})
    .sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'')}).slice(0,5);

  var bars=counts.map(function(n,i){
    var isNow=i===13,h=n===0?1:Math.round(8+(n/max)*88);
    return '<div class="'+(n===0?'zero':isNow?'now':'')+'" style="height:'+h+'px" title="'+days[i]+' '+n+'"></div>';
  }).join('');

  $('dash').innerHTML=
    '<h1 class="h">記録</h1>'+
    '<div class="today"><b>'+counts[13]+'</b><span>今日 投げた</span></div>'+
    '<div class="chart">'+bars+'</div>'+
    '<div class="axis"><span>'+days[0].slice(5).replace('-','.')+'</span><span>14日</span><span>'+days[13].slice(5).replace('-','.')+'</span></div>'+
    '<div class="stats">'+
      '<div><b>'+inbox+'</b><span>箱にある</span></div>'+
      '<div><b>'+toH+'</b><span>習慣へ</span></div>'+
      '<div><b>'+toP+'</b><span>予定へ</span></div>'+
    '</div>'+
    '<div class="recent">'+(sent.length
      ? sent.map(function(c){return '<div class="r"><p>'+esc(c.text)+'</p><em>'+(c.status==='growing'?'習慣':'予定')+'</em></div>'}).join('')
      : '<p class="empty">まだ行動へ送ったものはない。</p>')+
    '</div>'+
    '<div class="dfoot"><button id="exp">書き出す</button><span>'+state.captures.length+' 件を、この端末に保存中</span></div>';

  var exp=$('exp');
  if(exp)exp.addEventListener('click',function(){
    var json=JSON.stringify(state,null,2);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(function(){say('全データをコピーした')},function(){say('コピーできなかった')});
    }else say('コピーに対応していない');
  });
}

/* ───────── 起動 ───────── */
goPane(1,false);
setTimeout(function(){goPane(1,false);measure();build();drawDash()},60);
window.addEventListener('load',function(){goPane(1,false);measure();build()});
build();drawDash();
if(!SR)say('この端末では音声が使えない。押すと手で書ける。');
})();
</script>
